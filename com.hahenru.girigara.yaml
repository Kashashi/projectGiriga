app-id: com.hahenru.girigara
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: projectGIRIGARA

finish-args:
  # 允許 X11 與 Wayland 視窗系統訪問
  - --socket=wayland
  # 停用過時的X11支持。
  #- --socket=fallback-x11
  # 允許硬體加速圖形渲染 (OpenGL / DRI)
  - --device=dri
  # 音訊系統訪問 (PipeWire / PulseAudio)
  - --socket=pulseaudio
  # 共享記憶體通訊
  - --share=ipc

modules:
  # 建置專案主程式
  - name: projectGIRIGARA
    buildsystem: simple
    build-commands:
      # 使用系統/環境內的 g++ 編譯出二進位檔
      - make linux TARGET=build/projectGIRIGARA
      # 建立目標安裝路徑
      - install -d /app/bin
      - install -d /app/share/com.hahenru.girigara
      # 安裝執行檔與資源檔
      - install -m 755 build/projectGIRIGARA /app/share/com.hahenru.girigara/projectGIRIGARA
      - cp -r assets /app/share/com.hahenru.girigara/
      # 安裝啟動封裝腳本 (確保執行時工作目錄在資源路徑內)
      - |
        cat << 'EOF' > /app/bin/projectGIRIGARA
        #!/bin/sh
        cd /app/share/com.hahenru.girigara
        exec ./projectGIRIGARA "$@"
        EOF
      - chmod 755 /app/bin/projectGIRIGARA
      # 安裝桌面圖示與捷徑
      - install -d /app/share/icons/hicolor/512x512/apps
      - install -m 644 assets/icons/com.hahenru.girigara.png /app/share/icons/hicolor/512x512/apps/com.hahenru.girigara.png
      - install -d /app/share/applications
      - install -m 644 com.hahenru.girigara.desktop /app/share/applications/
      - install -d /app/share/metainfo
      - install -m 644 com.hahenru.girigara.metainfo.xml /app/share/metainfo/
    sources:
      # 直接使用本地目錄下的原始碼進行打包建置
      - type: dir
        path: .
