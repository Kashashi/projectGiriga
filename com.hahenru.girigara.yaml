app-id: com.hahenru.girigara
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: projectGIRIGARA

finish-args:
  # 允許 X11 與 Wayland 視窗系統訪問
  - --socket=wayland
  # 停用過時的X11支持。
  #- --socket=fallback-x11
  # 允許硬體加速圖形渲染 (OpenGL / DRI)
  - --device=dri
  # 音訊系統訪問 (PipeWire / PulseAudio)
  - --socket=pulseaudio
  # 共享記憶體通訊
  - --share=ipc

modules:
  # 1. 建置 Lua (若 Runtime 內沒有滿足需求的 Lua 版本，可作為獨立 module 編譯)
  - name: lua
    buildsystem: autotools
    no-autogen: true
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.5.1.tar.gz
        sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    make-install-args:
      - INSTALL_TOP=/app
    build-commands:
      - make linux-readline MYCFLAGS="-fPIC"
      - make install INSTALL_TOP=/app

  # 2. 建置 GLFW
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.tar.gz
        sha256: a13b8656ae534cb358be859e95fa59b4c09d57fb02f8313a246835a6669910d5

  # 3. 建置專案主程式
  - name: projectGIRIGARA
    buildsystem: simple
    build-commands:
      # 使用系統/環境內的 g++ 編譯出二進位檔
      - make linux TARGET=build/projectGIRIGARA
      # 建立目標安裝路徑
      - install -d /app/bin
      - install -d /app/share/com.hahenru.girigara
      # 安裝執行檔與資源檔
      - install -m 755 build/projectGIRIGARA /app/share/com.hahenru.girigara/projectGIRIGARA
      - cp -r assets /app/share/com.hahenru.girigara/
      # 安裝啟動封裝腳本 (確保執行時工作目錄在資源路徑內)
      - |
        cat << 'EOF' > /app/bin/projectGIRIGARA
        #!/bin/sh
        cd /app/share/com.hahenru.girigara
        exec ./projectGIRIGARA "$@"
        EOF
      - chmod 755 /app/bin/projectGIRIGARA
      # 安裝桌面圖示與捷徑
      - install -d /app/share/icons/hicolor/512x512/apps
      - install -m 644 assets/icons/com.hahenru.girigara.png /app/share/icons/hicolor/512x512/apps/com.hahenru.girigara.png
      - install -d /app/share/applications
      - install -m 644 com.hahenru.girigara.desktop /app/share/applications/
      - install -d /app/share/metainfo
      - install -m 644 com.hahenru.girigara.metainfo.xml /app/share/metainfo/
    sources:
      # 直接使用本地目錄下的原始碼進行打包建置
      - type: dir
        path: .
